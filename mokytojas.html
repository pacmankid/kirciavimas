<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mokytojo rezultatai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stilius.css">
</head>
<body>
<main class="puslapis platus">

  <!-- Prisijungimas -->
  <section id="prisijungimas" style="max-width:420px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:16px; padding-top:40px">
    <p class="logo">Kirčiuoklis<span>´</span></p>
    <span class="demo-zyme" id="demo-zyme" hidden>Demo režimas: tinka bet koks PIN</span>
    <h1 class="pavadinimas">Mokytojo puslapis</h1>
    <form id="pin-forma" class="kortele" style="display:flex; flex-direction:column; gap:14px">
      <div class="laukas">
        <label for="pin">Mokytojo PIN</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      </div>
      <p class="klaidos-pranesimas" id="pin-klaida" aria-live="polite"></p>
      <button class="mygtukas" type="submit" id="pin-mygtukas">Žiūrėti rezultatus</button>
    </form>
  </section>

  <!-- Rezultatai -->
  <section id="rezultatai" hidden style="display:flex; flex-direction:column; gap:18px">
    <div class="virsus">
      <div>
        <p class="logo">Kirčiuoklis<span>´</span></p>
        <h1 class="pavadinimas" style="font-size:28px; margin-top:6px">Mokinių rezultatai</h1>
      </div>
      <div class="filtrai">
        <div class="laukas">
          <label for="filtras-klase">Klasė</label>
          <select id="filtras-klase"><option value="">Visos</option></select>
        </div>
        <div class="laukas">
          <label for="filtras-vardas">Mokinys</label>
          <input id="filtras-vardas" placeholder="Ieškoti vardo">
        </div>
        <button class="mygtukas antrinis" id="atnaujinti" style="height:44px; font-size:15px">Atnaujinti</button>
      </div>
    </div>

    <div class="santrauka">
      <div class="kortele"><span class="antraste">Bandymų</span><b id="sk-bandymu">0</b></div>
      <div class="kortele"><span class="antraste">Mokinių</span><b id="sk-mokiniu">0</b></div>
      <div class="kortele"><span class="antraste">Vidurkis</span><b id="vidurkis">–</b></div>
    </div>

    <div class="kortele">
      <span class="antraste">Sunkiausi žodžiai</span>
      <ul class="sunkiausi" id="sunkiausi"></ul>
    </div>

    <div class="lenteles-dezute">
      <table>
        <thead>
          <tr><th>Mokinys</th><th>Klasė</th><th>Data</th><th>Rezultatas</th><th>Klaidos</th></tr>
        </thead>
        <tbody id="eilutes"></tbody>
      </table>
    </div>
  </section>

</main>
<script src="nustatymai.js"></script>
<script src="bendra.js"></script>
<script src="mokytojas.js"></script>
</body>
</html>
